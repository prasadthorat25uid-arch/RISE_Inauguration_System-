<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
  
<meta 
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>RISE Inauguration Display</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-bridge.js"></script>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070f;
    font-family: Arial, sans-serif;
}

/* ================================
   MAIN STAGE
================================ */

.stage {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
    background: #03040a;
}

/* ================================
   LEAFLET / POSTER
================================ */

.leaflet-container {
    position: absolute;
    inset: 0;
    z-index: 2;

    opacity: 0;
    transform: scale(1.04);
    filter: blur(10px);

    transition:
        opacity 1.2s ease,
        transform 1.6s cubic-bezier(.22, 1, .36, 1),
        filter 1.2s ease;
}

.stage[data-state="open"] .leaflet-container {
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
    transition-delay: 1.3s;
}

.leaflet-bg {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scale(1.15);

    filter:
        blur(45px)
        brightness(.42)
        saturate(1.25);
}

.leaflet-main {
    position: relative;

    width: 100%;
    height: 100%;

    object-fit: contain;

    z-index: 1;

    filter:
        drop-shadow(0 0 40px rgba(255, 215, 120, .35))
        drop-shadow(0 20px 60px rgba(0, 0, 0, .6));
}

/* ================================
   GOLDEN AURA
================================ */

.golden-aura {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 20vw;
    height: 20vw;

    transform:
        translate(-50%, -50%)
        scale(.3);

    border-radius: 50%;

    z-index: 1;

    opacity: 0;

    background:
        radial-gradient(
            circle,
            rgba(255, 245, 180, .85) 0%,
            rgba(255, 190, 40, .35) 35%,
            transparent 72%
        );

    filter: blur(25px);

    pointer-events: none;

    transition:
        opacity 1.5s ease,
        transform 2.2s cubic-bezier(.22, 1, .36, 1);
}

.stage[data-state="open"] .golden-aura {
    opacity: .22;

    transform:
        translate(-50%, -50%)
        scale(5);

    transition-delay: 1.25s;
}

/* ================================
   CURTAINS
================================ */

.curtain-wrap {
    position: absolute;

    top: 0;

    width: 54%;
    height: 100%;

    z-index: 15;

    overflow: visible;

    transition:
        transform 2.2s cubic-bezier(.76, 0, .24, 1);
}

.curtain-wrap.left {
    left: 0;
    transform-origin: top left;
    transform: translateX(0);
}

.curtain-wrap.right {
    right: 0;
    transform-origin: top right;
    transform: translateX(0);
}

.stage[data-state="open"] .curtain-wrap.left {
    transform: translateX(-118%);
}

.stage[data-state="open"] .curtain-wrap.right {
    transform: translateX(118%);
}

.curtain {
    position: relative;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background:
        repeating-linear-gradient(
            90deg,
            #080c1e 0%,
            #0f1836 3.2%,
            #1b2a55 6%,
            #243a72 8.4%,
            #152449 11%,
            #0b1330 14%,
            #132140 17%,
            #1e3160 19.6%
        );

    box-shadow:
        inset 0 0 60px rgba(0, 0, 0, .85),
        inset 0 0 140px rgba(0, 0, 0, .6),
        14px 0 34px rgba(0, 0, 0, .55);

    transition:
        transform 2.2s cubic-bezier(.76, 0, .24, 1),
        border-radius 2.2s cubic-bezier(.76, 0, .24, 1),
        box-shadow 2.2s ease;
}

.stage[data-state="open"] .curtain-wrap.left .curtain {
    transform: scaleX(.46);
    transform-origin: right center;

    border-radius:
        0 60% 60% 0 /
        0 42% 42% 0;
}

.stage[data-state="open"] .curtain-wrap.right .curtain {
    transform: scaleX(.46);
    transform-origin: left center;

    border-radius:
        60% 0 0 60% /
        42% 0 0 42%;
}

.curtain::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, .10) 0%,
            rgba(255, 255, 255, .10) .4%,
            transparent 1.6%,
            rgba(0, 0, 0, .35) 2.6%,
            transparent 4.4%,
            transparent 8.4%
        );

    mix-blend-mode: overlay;

    pointer-events: none;
}

.curtain::after {
    content: "";

    position: absolute;

    top: 0;
    left: -60%;

    width: 40%;
    height: 100%;

    background:
        linear-gradient(
            100deg,
            transparent,
            rgba(255, 222, 160, .08),
            transparent
        );

    transform: skewX(-12deg);

    animation:
        curtainShine 9s linear infinite;
}

@keyframes curtainShine {

    from {
        left: -60%;
    }

    to {
        left: 130%;
    }
}

/* ================================
   TOP PELMET
================================ */

.pelmet {
    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 8.5%;

    z-index: 20;

    background:
        linear-gradient(
            180deg,
            #1c2f5e 0%,
            #132140 55%,
            #050810 100%
        );

    box-shadow:
        0 10px 30px rgba(0, 0, 0, .65),
        inset 0 -5px 12px rgba(0, 0, 0, .55),
        inset 0 3px 6px rgba(255, 200, 120, .15);

    border-bottom: 3px solid #d4af37;

    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.22, 1, .36, 1);
}

.stage[data-state="open"] .pelmet {
    opacity: 0;
    transform: translateY(-100%);
    transition-delay: .2s;
}

/* ================================
   GOLDEN CENTER SEAM
================================ */

.center-seam {
    position: absolute;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    width: 4px;
    height: 100%;

    z-index: 17;

    background:
        linear-gradient(
            to bottom,
            #fff7b0,
            #f8c348,
            #fff1a0,
            #d99818
        );

    box-shadow:
        0 0 10px #ffc83d,
        0 0 25px rgba(255, 190, 50, .8),
        0 0 60px rgba(255, 150, 20, .5);

    transition: opacity .6s ease;
}

.stage[data-state="open"] .center-seam {
    opacity: 0;
}

/* ================================
   GOLDEN OPENING PULSE
================================ */

.golden-pulse {
    position: absolute;

    left: 50%;
    top: 50%;

    width: 20px;
    height: 20px;

    transform:
        translate(-50%, -50%)
        scale(0);

    z-index: 30;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 20px #fff,
        0 0 50px #ffd54f,
        0 0 100px #ff9800;

    pointer-events: none;
}

.stage.pulse-flash .golden-pulse {
    animation:
        goldenPulse 1.1s ease-out forwards;
}

@keyframes goldenPulse {

    0% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(0);
    }

    25% {
        opacity: 1;

        transform:
            translate(-50%, -50%)
            scale(2);
    }

    100% {
        opacity: 0;

        transform:
            translate(-50%, -50%)
            scale(35);
    }
}

/* ================================
   CINEMATIC FLASH
================================ */

.flash {
    position: absolute;
    inset: 0;

    z-index: 29;

    opacity: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            rgba(255, 255, 240, .95),
            rgba(255, 210, 80, .4),
            transparent 70%
        );
}

.stage.pulse-flash .flash {
    animation:
        cinematicFlash 1.2s ease-out forwards;
}

@keyframes cinematicFlash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: .9;
    }

    100% {
        opacity: 0;
    }
}

/* ================================
   CELEBRATION CANVASES
================================ */

#celebrationCanvas,
#sparkleCanvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;

    display: none;
}

#sparkleCanvas {
    z-index: 35;
}

#celebrationCanvas {
    z-index: 40;
}

</style>

</head>

<body>

<div
    class="stage"
    id="stage"
    data-state="closed"
>

    <div class="golden-aura"></div>

    <div class="leaflet-container">

        <img
            class="leaflet-bg"
            src="assets/rise-poster.jpg"
            alt=""
            aria-hidden="true"
        >

        <img
            class="leaflet-main"
            src="assets/rise-poster.jpg"
            alt="RISE poster"
        >

    </div>

    <div class="curtain-wrap left">
        <div class="curtain"></div>
    </div>

    <div class="curtain-wrap right">
        <div class="curtain"></div>
    </div>

    <div class="pelmet"></div>

    <div class="center-seam"></div>

    <div class="golden-pulse"></div>

    <div class="flash"></div>

    <canvas id="sparkleCanvas"></canvas>

    <canvas id="celebrationCanvas"></canvas>

</div>

<script>

/* ================================
   SOCKET
================================ */

const socket = io();

/* ================================
   ELEMENTS
================================ */

const stage =
    document.getElementById("stage");

const leafletMain =
    document.querySelector(".leaflet-main");

const leafletBg =
    document.querySelector(".leaflet-bg");

const celebrationCanvas =
    document.getElementById("celebrationCanvas");

const sparkleCanvas =
    document.getElementById("sparkleCanvas");

const ctx =
    celebrationCanvas.getContext("2d");

const sparkleCtx =
    sparkleCanvas.getContext("2d");

/* ================================
   GALLERY — ADD 20+ IMAGES HERE
================================ */

const GALLERY_IMAGES = [

    {
        src: "assets/rise-poster.jpg"
    }

];

let currentImageIndex = 0;

let imageChangeInProgress = false;

/* ================================
   CANVAS SIZE
================================ */

function resizeCanvases() {

    celebrationCanvas.width =
        window.innerWidth;

    celebrationCanvas.height =
        window.innerHeight;

    sparkleCanvas.width =
        window.innerWidth;

    sparkleCanvas.height =
        window.innerHeight;
}

resizeCanvases();

window.addEventListener(
    "resize",
    resizeCanvases
);

/* ================================
   CONNECTION
================================ */

socket.on("connect", () => {

    console.log(
        "✅ Display connected:",
        socket.id
    );
});

socket.on("disconnect", () => {

    console.log(
        "❌ Display disconnected"
    );
});

/* ================================
   CURTAIN STATE
================================ */

socket.on(
    "curtain-state",

    (state) => {

        setCurtainState(
            state,
            false
        );
    }
);

socket.on(
    "open-curtain",

    () => {

        console.log(
            "🟢 OPEN command received"
        );

        setCurtainState(
            "open",
            true
        );
    }
);

socket.on(
    "close-curtain",

    () => {

        console.log(
            "🔴 CLOSE command received"
        );

        setCurtainState(
            "closed",
            false
        );
    }
);

function setCurtainState(
    state,
    withFanfare
) {

    if (
        stage.dataset.state === state
    ) {
        return;
    }

    stage.dataset.state = state;

    if (
        state === "open" &&
        withFanfare
    ) {

        stage.classList.add(
            "pulse-flash"
        );

        setTimeout(
            () => {

                stage.classList.remove(
                    "pulse-flash"
                );

            },
            1300
        );
    }

    if (
        state === "closed"
    ) {

        stopAllEffects();
    }
}

/* ================================
   SET POSTER + NAME
================================ */

function setLeafletImage(index) {

    const item =
        GALLERY_IMAGES[index];

    if (!item) {
        return;
    }

    const safeSrc =
        encodeURI(item.src);

    leafletMain.src =
        safeSrc;

    leafletBg.src =
        safeSrc;

    console.log(
        `🖼️ Image ${index + 1}: ${item.src}`
    );
}

/* ================================
   IMAGE CHANGE
================================ */

const CURTAIN_TRANSITION_MS = 2200;

const SWAP_BUFFER_MS = 300;

const REOPEN_DELAY_MS = 400;

function goToImage(targetIndex) {

    if (
        imageChangeInProgress ||
        GALLERY_IMAGES.length === 0
    ) {
        return;
    }

    imageChangeInProgress = true;

    const nextIndex =
        (
            (
                targetIndex %
                GALLERY_IMAGES.length
            )
            +
            GALLERY_IMAGES.length
        )
        %
        GALLERY_IMAGES.length;

    const wasOpen =
        stage.dataset.state === "open";

    function swapThenReopen() {

        currentImageIndex =
            nextIndex;

        setLeafletImage(
            currentImageIndex
        );

        setTimeout(
            () => {

                setCurtainState(
                    "open",
                    true
                );

                imageChangeInProgress =
                    false;

            },
            REOPEN_DELAY_MS
        );
    }

    if (wasOpen) {

        setCurtainState(
            "closed",
            false
        );

        setTimeout(
            swapThenReopen,
            CURTAIN_TRANSITION_MS
            +
            SWAP_BUFFER_MS
        );

    } else {

        swapThenReopen();
    }
}

socket.on(
    "next-image",
    () => {

        goToImage(
            currentImageIndex + 1
        );
    }
);

socket.on(
    "prev-image",
    () => {

        goToImage(
            currentImageIndex - 1
        );
    }
);

socket.on(
    "show-image",
    (index) => {

        goToImage(
            Number(index)
        );
    }
);

setLeafletImage(
    currentImageIndex
);

/* ================================
   CELEBRATION SYSTEM
================================ */

socket.on(
    "celebrate",
    (effectType) => {

        console.log(
            "🎉 Effect received:",
            effectType
        );

        launchEffect(
            effectType
        );
    }
);

let particles = [];

let sparkles = [];

let celebrationRunning = false;

let animLoopActive = false;

let sparkleRunning = false;

let effectTimer = null;

let sparkleTimer = null;

let frameCount = 0;

const CONFETTI_COLORS = [
    "#ff1744",
    "#ffea00",
    "#00e676",
    "#2979ff",
    "#d500f9",
    "#ff9100",
    "#ffffff",
    "#ffd700"
];

const GOLD_COLORS = [
    "#ffd700",
    "#ffe9a8",
    "#fff1c1",
    "#d4af37",
    "#fff8dc"
];

function stopAllEffects() {

    celebrationRunning = false;

    sparkleRunning = false;

    animLoopActive = false;

    clearTimeout(effectTimer);

    clearTimeout(sparkleTimer);

    particles = [];

    sparkles = [];

    celebrationCanvas.style.display =
        "none";

    sparkleCanvas.style.display =
        "none";

    ctx.clearRect(
        0,
        0,
        celebrationCanvas.width,
        celebrationCanvas.height
    );

    sparkleCtx.clearRect(
        0,
        0,
        sparkleCanvas.width,
        sparkleCanvas.height
    );
}

function launchEffect(type) {

    clearTimeout(effectTimer);

    celebrationCanvas.style.display =
        "block";

    particles = [];

    switch (type) {

        case "confetti":

            confettiBlast();

            break;

        case "gold":

            goldShower();

            break;

        case "fireworks":

            fireworksShow();

            break;

        case "streamers":

            streamerDrop();

            break;

        default:

            confettiBlast();
    }

    startAmbientSparkles();

    celebrationRunning = true;

    if (!animLoopActive) {

        animLoopActive = true;

        animateParticles();
    }

    effectTimer = setTimeout(
        () => {

            celebrationRunning = false;

            celebrationCanvas.style.display =
                "none";

            particles = [];

        },
        8000
    );
}

/* ================================
   PARTY POPPER / CONFETTI
================================ */

function confettiBlast() {

    burstFrom(
        celebrationCanvas.width * .06,
        celebrationCanvas.height * .94,
        CONFETTI_COLORS
    );

    burstFrom(
        celebrationCanvas.width * .94,
        celebrationCanvas.height * .94,
        CONFETTI_COLORS
    );
}

function burstFrom(
    x,
    y,
    colors
) {

    for (
        let i = 0;
        i < 160;
        i++
    ) {

        const angle =
            -Math.PI / 2
            +
            (Math.random() - .5)
            *
            1.5;

        const speed =
            9
            +
            Math.random()
            *
            19;

        particles.push({

            x,
            y,

            vx:
                Math.cos(angle)
                *
                speed,

            vy:
                Math.sin(angle)
                *
                speed,

            gravity:
                .18
                +
                Math.random()
                *
                .18,

            drag: .987,

            size:
                5
                +
                Math.random()
                *
                11,

            rotation:
                Math.random()
                *
                Math.PI,

            rotationSpeed:
                (Math.random() - .5)
                *
                .4,

            color:
                colors[
                    Math.floor(
                        Math.random()
                        *
                        colors.length
                    )
                ],

            life: 1,

            decay: .0035,

            shape:
                Math.random() > .7
                    ?
                    "circle"
                    :
                    "rectangle"
        });
    }
}

/* ================================
   GOLD SHOWER
================================ */

function goldShower() {

    for (
        let i = 0;
        i < 140;
        i++
    ) {

        particles.push({

            x:
                Math.random()
                *
                celebrationCanvas.width,

            y:
                -20
                -
                Math.random()
                *
                celebrationCanvas.height
                *
                .5,

            vx:
                (Math.random() - .5)
                *
                .6,

            vy:
                1.5
                +
                Math.random()
                *
                2.5,

            gravity: .01,

            drag: 1,

            size:
                3
                +
                Math.random()
                *
                6,

            rotation:
                Math.random()
                *
                Math.PI,

            rotationSpeed:
                (Math.random() - .5)
                *
                .1,

            color:
                GOLD_COLORS[
                    Math.floor(
                        Math.random()
                        *
                        GOLD_COLORS.length
                    )
                ],

            life: 1,

            decay: .0012,

            shape: "circle",

            sway:
                1
                +
                Math.random()
                *
                1.5,

            swayFreq:
                .01
                +
                Math.random()
                *
                .02,

            swayPhase:
                Math.random()
                *
                Math.PI
                *
                2
        });
    }
}

/* ================================
   FIREWORKS
================================ */

function fireworksShow() {

    let launched = 0;

    const totalBursts = 6;

    function launchOne() {

        if (
            !celebrationRunning &&
            launched > 0
        ) {
            return;
        }

        const x =
            celebrationCanvas.width
            *
            (
                .2
                +
                Math.random()
                *
                .6
            );

        const y =
            celebrationCanvas.height
            *
            (
                .18
                +
                Math.random()
                *
                .35
            );

        burstFrom(
            x,
            y,
            CONFETTI_COLORS
        );

        launched++;

        if (
            launched < totalBursts
        ) {

            setTimeout(
                launchOne,
                500
                +
                Math.random()
                *
                500
            );
        }
    }

    launchOne();
}

/* ================================
   STREAMERS
================================ */

function streamerDrop() {

    for (
        let i = 0;
        i < 90;
        i++
    ) {

        particles.push({

            x:
                Math.random()
                *
                celebrationCanvas.width,

            y:
                -30
                -
                Math.random()
                *
                celebrationCanvas.height
                *
                .5,

            vx: 0,

            vy:
                1.2
                +
                Math.random()
                *
                1.8,

            gravity: .01,

            drag: 1,

            size:
                18
                +
                Math.random()
                *
                22,

            rotation:
                Math.random()
                *
                Math.PI,

            rotationSpeed:
                (Math.random() - .5)
                *
                .05,

            color:
                CONFETTI_COLORS[
                    Math.floor(
                        Math.random()
                        *
                        CONFETTI_COLORS.length
                    )
                ],

            life: 1,

            decay: .001,

            shape: "ribbon",

            sway:
                2
                +
                Math.random()
                *
                2,

            swayFreq:
                .008
                +
                Math.random()
                *
                .015,

            swayPhase:
                Math.random()
                *
                Math.PI
                *
                2
        });
    }
}

/* ================================
   PARTICLE ANIMATION
================================ */

function animateParticles() {

    if (!celebrationRunning) {

        ctx.clearRect(
            0,
            0,
            celebrationCanvas.width,
            celebrationCanvas.height
        );

        animLoopActive = false;

        return;
    }

    frameCount++;

    ctx.clearRect(
        0,
        0,
        celebrationCanvas.width,
        celebrationCanvas.height
    );

    particles.forEach(
        p => {

            if (p.sway) {

                p.x +=
                    Math.sin(
                        frameCount
                        *
                        p.swayFreq
                        +
                        p.swayPhase
                    )
                    *
                    p.sway
                    *
                    .1;
            }

            p.x += p.vx;

            p.y += p.vy;

            p.vy += p.gravity;

            p.vx *= p.drag;

            p.rotation +=
                p.rotationSpeed;

            p.life -=
                p.decay;

            ctx.save();

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(
                p.rotation
            );

            ctx.globalAlpha =
                Math.max(
                    p.life,
                    0
                );

            ctx.fillStyle =
                p.color;

            if (
                p.shape === "circle"
            ) {

                ctx.beginPath();

                ctx.arc(
                    0,
                    0,
                    p.size / 2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();

            } else if (
                p.shape === "ribbon"
            ) {

                ctx.fillRect(
                    -p.size / 8,
                    -p.size / 2,
                    p.size / 4,
                    p.size
                );

            } else {

                ctx.fillRect(
                    -p.size / 2,
                    -p.size / 4,
                    p.size,
                    p.size / 2
                );
            }

            ctx.restore();
        }
    );

    particles =
        particles.filter(
            p =>
                p.life > 0
                &&
                p.y
                <
                celebrationCanvas.height
                +
                150
        );

    requestAnimationFrame(
        animateParticles
    );
}

/* ================================
   AMBIENT GOLD SPARKLES
================================ */

function startAmbientSparkles() {

    sparkleCanvas.style.display =
        "block";

    sparkles = [];

    for (
        let i = 0;
        i < 90;
        i++
    ) {

        sparkles.push({

            x:
                Math.random()
                *
                sparkleCanvas.width,

            y:
                Math.random()
                *
                sparkleCanvas.height,

            size:
                1
                +
                Math.random()
                *
                4,

            opacity:
                Math.random(),

            speed:
                .2
                +
                Math.random()
                *
                .8,

            phase:
                Math.random()
                *
                Math.PI
                *
                2
        });
    }

    sparkleRunning = true;

    animateSparkles();

    clearTimeout(
        sparkleTimer
    );

    sparkleTimer =
        setTimeout(
            () => {

                sparkleRunning = false;

                sparkleCanvas.style.display =
                    "none";

                sparkles = [];

            },
            6500
        );
}

function animateSparkles() {

    if (!sparkleRunning) {

        sparkleCtx.clearRect(
            0,
            0,
            sparkleCanvas.width,
            sparkleCanvas.height
        );

        return;
    }

    sparkleCtx.clearRect(
        0,
        0,
        sparkleCanvas.width,
        sparkleCanvas.height
    );

    sparkles.forEach(
        s => {

            s.phase += .05;

            s.y -= s.speed;

            if (s.y < 0) {

                s.y =
                    sparkleCanvas.height;
            }

            const alpha =
                .25
                +
                Math.abs(
                    Math.sin(
                        s.phase
                    )
                )
                *
                .75;

            sparkleCtx.save();

            sparkleCtx.globalAlpha =
                alpha;

            sparkleCtx.fillStyle =
                "#ffd54f";

            sparkleCtx.beginPath();

            sparkleCtx.moveTo(
                s.x,
                s.y - s.size * 2
            );

            sparkleCtx.lineTo(
                s.x + s.size,
                s.y
            );

            sparkleCtx.lineTo(
                s.x,
                s.y + s.size * 2
            );

            sparkleCtx.lineTo(
                s.x - s.size,
                s.y
            );

            sparkleCtx.closePath();

            sparkleCtx.fill();

            sparkleCtx.restore();
        }
    );

    requestAnimationFrame(
        animateSparkles
    );
}

</script>

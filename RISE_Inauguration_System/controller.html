<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RISE Inauguration — Controller</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-bridge.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{
  --navy-950:#05070f;
  --navy-900:#0b1330;
  --navy-800:#111d40;
  --navy-700:#1c2b56;
  --gold:#f0a93d;
  --gold-light:#ffd76a;
  --orange:#e8790a;
  --cream:#f5f1e8;
  --ink-dim:#a9b3d1;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  padding: 22px 18px 40px;
  background:
    radial-gradient(circle at 50% 0%, rgba(240,169,61,.10), transparent 45%),
    linear-gradient(180deg, var(--navy-950), var(--navy-900) 60%);
  color: var(--cream);
  font-family: 'Inter', Arial, sans-serif;
  text-align: center;
}

.brand-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  margin-bottom:2px;
}
.brand-row svg{width:16px;height:16px;fill:var(--gold-light)}
.brand-row span{
  font-size:11px;
  font-weight:600;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--gold-light);
}

h1 {
  font-family:'Sora',sans-serif;
  font-weight:800;
  margin: 4px 0 2px;
  font-size: clamp(1.6rem, 6vw, 2.1rem);
  color: var(--cream);
}

.subtitle {
  margin-top: 4px;
  color: var(--ink-dim);
  font-size: 13.5px;
}

.status {
  display: inline-block;
  margin: 14px 0 22px;
  padding: 8px 18px;
  border-radius: 30px;
  font-size: 13px;
  font-weight: 600;
  background: #3a3f52;
  border: 1px solid rgba(255,255,255,.08);
}

.status.connected {
  background: #16803c;
  border-color: rgba(34,197,94,.5);
}

.panel {
  width: 100%;
  max-width: 520px;
  margin: auto;
  padding: 22px;
  border: 1px solid rgba(240, 169, 61, .22);
  border-radius: 20px;
  background: linear-gradient(165deg, var(--navy-800), var(--navy-900));
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.section-title {
  margin: 22px 0 12px;
  color: var(--gold-light);
  font-size: 12.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.4px;
}

.panel > .section-title:first-child { margin-top: 0; }

.controls {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

button {
  min-height: 68px;
  padding: 12px;
  border: none;
  border-radius: 14px;
  color: white;
  font-family:'Inter',Arial,sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .15s ease, filter .15s ease;
}

button:active { transform: scale(.94); }
button:hover { filter: brightness(1.1); }

.open-btn {
  background: linear-gradient(135deg, #147d35, #22c55e);
}

.close-btn {
  background: linear-gradient(135deg, #7a1f2b, #c23b4a);
}

.nav-btn {
  background: linear-gradient(135deg, #16224a, #2a4590);
}

.confetti-btn {
  background: linear-gradient(135deg, #7c2d92, #c2489a);
}

.gold-btn {
  background: linear-gradient(135deg, var(--orange), var(--gold));
  color: #211400;
}

.fireworks-btn {
  background: linear-gradient(135deg, #2c2a63, #6a4fc9);
}

.streamers-btn {
  background: linear-gradient(135deg, #0f6a8a, #17b7c9);
}

.image-info {
  margin-top: 18px;
  padding: 13px;
  border-radius: 12px;
  background: rgba(240, 169, 61, .08);
  border: 1px solid rgba(240, 169, 61, .18);
  color: var(--gold-light);
  font-size: 13.5px;
  font-weight: 600;
}

footer{
  margin-top:26px;
  font-size:11px;
  color: var(--ink-dim);
  letter-spacing:.04em;
}

</style>

</head>

<body>

<div class="brand-row">
  <svg viewBox="0 0 24 24"><path d="M2 21l20-9L2 3v7l14 2-14 2z"/></svg>
  <span>RISE Inauguration System</span>
</div>

<h1>Control Panel</h1>

<p class="subtitle">
  Mobile remote for the curtain, posters &amp; effects
</p>

<div
    class="status"
    id="status"
>
    Connecting...
</div>

<div class="panel">

    <div class="section-title">
        Curtain Controls
    </div>

    <div class="controls">

        <button
            class="open-btn"
            onclick="openCurtain()"
        >
            🎭 Open Curtain
        </button>

        <button
            class="close-btn"
            onclick="closeCurtain()"
        >
            🔒 Close Curtain
        </button>

    </div>

    <div class="section-title">
        Poster Navigation
    </div>

    <div class="controls">

        <button
            class="nav-btn"
            onclick="previousImage()"
        >
            ⬅ Previous
        </button>

        <button
            class="nav-btn"
            onclick="nextImage()"
        >
            Next ➡
        </button>

    </div>

    <div
        class="image-info"
        id="imageInfo"
    >
        Current Poster: 1
    </div>

    <div class="section-title">
        Celebration Effects
    </div>

    <div class="controls">

        <button
            class="confetti-btn"
            onclick="celebrate('confetti')"
        >
            🎊 Party Popper
        </button>

        <button
            class="gold-btn"
            onclick="celebrate('gold')"
        >
            ✨ Gold Shower
        </button>

        <button
            class="fireworks-btn"
            onclick="celebrate('fireworks')"
        >
            🎆 Fireworks
        </button>

        <button
            class="streamers-btn"
            onclick="celebrate('streamers')"
        >
            🎉 Streamers
        </button>

    </div>

</div>

<footer>RISE — Research &amp; Innovation Society for Emerging Intelligence, Sanjivani University</footer>

<script>

const socket = io();

let currentImage = 0;

const statusElement =
    document.getElementById("status");

const imageInfo =
    document.getElementById("imageInfo");

socket.on(
    "connect",
    () => {

        statusElement.textContent =
            "🟢 Connected";

        statusElement.classList.add(
            "connected"
        );
    }
);

socket.on(
    "disconnect",
    () => {

        statusElement.textContent =
            "🔴 Disconnected";

        statusElement.classList.remove(
            "connected"
        );
    }
);

function openCurtain() {

    socket.emit(
        "open-curtain"
    );
}

function closeCurtain() {

    socket.emit(
        "close-curtain"
    );
}

function nextImage() {

    currentImage++;

    updateImageInfo();

    socket.emit(
        "next-image"
    );
}

function previousImage() {

    currentImage--;

    updateImageInfo();

    socket.emit(
        "prev-image"
    );
}

function celebrate(type) {

    socket.emit(
        "celebrate",
        type
    );
}

function updateImageInfo() {

    imageInfo.textContent =
        `Current Poster: ${currentImage + 1}`;
}

socket.on(
    "show-image",
    (index) => {

        currentImage =
            Number(index);

        updateImageInfo();
    }
);

</script>

</body>

</html>
